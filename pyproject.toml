[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingbot"
version = "0.2.0"
description = "Minute-level Alpaca paper trading bot with an alpha framework, ML and RL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alpaca-py>=0.44",
    "python-dotenv>=1.2",
    "pandas>=3.0",
    "numpy>=2.5",
    "pyyaml>=6.0",
    "pyarrow>=25.0",
    "matplotlib>=3.11",
    "plotly>=7.1",
    "lightgbm>=4.7",
    "scikit-learn>=1.9",
    "gymnasium>=1.3",
    "stable-baselines3>=2.9",
    # CPU build: pip install torch --index-url https://download.pytorch.org/whl/cpu
    "torch>=2.14",
]

[project.optional-dependencies]
dev = ["pytest>=9.1"]

[project.scripts]
tradingbot = "tradingbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
