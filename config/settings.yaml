# settings.yaml
universe:
  - SPY
  - QQQ
  - IWM
  - DIA
  - XLK
  - XLF
  - XLE
  - XLV
  - AAPL
  - MSFT
  - NVDA
  - AMZN
  - GOOGL
  - META
  - TSLA
  - AVGO
  - JPM
  - V
  - UNH
  - XOM
  - JNJ
  - WMT
  - PG
  - MA
  - HD
  - COST
  - AMD
  - NFLX
  - CRM
  - BAC

benchmark: SPY

data:
  cache_dir: data/cache
  history_start: "2024-01-01"
  live_feed: iex        # free plan: iex only for real-time
  history_feed: sip     # free for data older than 15 minutes

# Strategy: hold an equal-weight basket of 22 large-cap stocks across days.
# Research on 2024-2026 minute data showed these stocks earned almost all their
# return overnight, and intraday signals lost money after costs. Chosen on
# 2024-2025 data; 2026 (unseen) backtest: see README.
#
# To go back to the intraday strategy: alphas [momentum, mean_reversion],
# decision_interval_min 5, first_decision_min 0, and in risk:
# flatten_at_close true, daily_loss_limit_pct 0.02, rebalance_band 0.03.
strategy:
  decision_interval_min: 30
  first_decision_min: 30      # skip the first 30 min after the open (wide spreads)
  alphas: [hold]              # hold | momentum | mean_reversion | ml
  portfolio: equal_weight     # equal_weight | rl (after `tradingbot train-rl`)
  ml_model_path: models/lgbm_alpha.txt
  rl_model_path: models/ppo_allocator.zip

alphas:
  hold:
    symbols: [AAPL, MSFT, NVDA, AMZN, GOOGL, META, TSLA, AVGO, JPM, V, UNH,
              XOM, JNJ, WMT, PG, MA, HD, COST, AMD, NFLX, CRM, BAC]
  momentum:
    lookback_min: 30
    threshold: 0.002        # 0.2% move over lookback to emit an insight
    period_min: 15
  mean_reversion:
    vwap_z_entry: 2.0
    lookback_min: 60
    period_min: 15
  ml:
    entry: 0.55             # emit an insight when P(up) >= 0.55 or <= 0.45
    period_min: 15

ml:
  horizon_min: 15
  dead_band: 0.0005         # ignore labels with |forward return| below 5 bps
  sample_every_min: 5
  min_train_months: 6

rl:
  total_timesteps: 500000
  train_until: null         # e.g. "2026-03-31"; later data is held out for evaluation
  turnover_cost_bps: 3.0
  risk_penalty: 0.1

risk:
  max_position_pct: 0.10      # of equity, per symbol
  max_gross_exposure: 1.0     # 1.0 = no leverage
  daily_loss_limit_pct: null  # kill-switch (e.g. 0.02); off: selling after a bad day locks in losses
  flatten_at_close: false     # hold overnight; that's where the returns were
  flatten_minutes_before_close: 5
  min_trade_value: 1000       # no trades smaller than this ($)
  rebalance_band: 0.01        # only resize a position once it drifts > 1% of equity
                              # (2%/$2,500 halved trades but cut 2026 return 12.6% -> 10.0%;
                              #  costs at this trade count are only ~$50 over 9 months)
  trend_filter:               # invested only while SPY > its N-day average (decided weekly)
    enabled: false            # tested: halved drawdowns but 2025 return +1.7% vs +12.4%,
                              # and the result hinged on a one-day timing detail
    symbol: SPY
    days: 100

costs:
  commission_per_share: 0.0
  slippage_bps: 2.0
  half_spread_bps: 1.0

logging:
  log_dir: logs
  equity_snapshot_min: 5
